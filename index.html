<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI画像編集" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>AI画像編集</title>
    <meta name="description" content="AIを使って画像内の物体を検出・編集できるアプリ" />
    
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    
    <meta property="og:title" content="AI画像編集" />
    <meta property="og:description" content="AIを使って画像内の物体を検出・編集できるアプリ" />
    <meta property="og:type" content="website" />
    
    <style>
      html { visibility: hidden; }
      html.loaded { visibility: visible; }
    </style>
    
    <script>
      // Handle GitHub Pages SPA redirect
      (function() {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
          const cleanPath = decodeURIComponent(redirect);
          sessionStorage.setItem('spa-redirect-path', cleanPath);
          const basePath = window.location.pathname.split('/').slice(0, -1).join('/') || '';
          window.history.replaceState(null, '', basePath + '/');
        }
      })();
      
      document.documentElement.classList.add('loaded');
    </script>
    <script type="module" crossorigin src="/pwa_aiImage/assets/index-C-ly5Cc7.js"></script>
    <link rel="stylesheet" crossorigin href="/pwa_aiImage/assets/index-DkM9fhDT.css">
  </head>

  <body>
    <div id="root"></div>
    
    <script>
      // Register Service Worker with correct path for GitHub Pages
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          const pathname = window.location.pathname;
          const pathParts = pathname.split('/').filter(Boolean);
          let basePath = '/';
          
          if (pathParts.length > 0 && pathname.startsWith('/' + pathParts[0] + '/')) {
            basePath = '/' + pathParts[0] + '/';
          }
          
          const swPath = basePath + 'sw.js';
          const scope = basePath;
          
          navigator.serviceWorker.register(swPath, { scope: scope }).then(function(registration) {
            console.log('SW registered:', registration.scope);
          }).catch(function(error) {
            console.log('SW registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
